<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEADORA | مدیریت هوشمند کسب‌وکار</title><meta name="theme-color" content="#14213d"><meta name="description" content="سامانه مدیریت عملیات کسب‌وکار LEADORA"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#14213d;color:white;padding:24px max(20px,calc((100% - 980px)/2))}header h1{margin:0 0 8px;font-size:28px}.install-btn{max-width:240px;margin-top:14px;background:#fff;color:#14213d;border:1px solid #cbd5e1}.install-btn[hidden]{display:none}main{max-width:980px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 20px #13203a08}h2{margin-top:0;font-size:20px}input,button,select{font:inherit;padding:12px;border:1px solid #ccd5e3;border-radius:9px;width:100%;margin:5px 0}button{background:#2563eb;color:white;border:0;cursor:pointer;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#64748b;font-size:14px}.status{padding:10px;background:#eff6ff;border-radius:8px;white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid #e2e8f0}
</style></head><body><header><h1>LEADORA</h1><div>سامانهٔ سبک مدیریت عملیات کسب‌وکار</div><button id="installBtn" class="install-btn">نصب LEADORA روی دستگاه</button></header><main>
<div class="card"><h2>ورود یا ساخت حساب شرکت</h2><p class="muted">نسخه MVP آزمایشی. اطلاعات این نمونه در پایگاه دادهٔ محلی ذخیره می‌شود.</p><div class="grid"><input id="company" placeholder="نام شرکت"><input id="industry" placeholder="حوزه فعالیت (برای ثبت‌نام)"><input id="email" type="email" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور (حداقل ۱۰ نویسه برای ثبت‌نام)"></div><div class="grid"><button onclick="auth('register')">ساخت حساب</button><button onclick="auth('login')">ورود</button></div><div id="status" class="status">برای شروع ثبت‌نام کنید یا وارد شوید.</div></div>
<div class="card"><h2>افزودن کالا</h2><div class="grid"><input id="sku" placeholder="کد کالا"><input id="pname" placeholder="نام کالا"><input id="price" type="number" min="0" placeholder="قیمت"><input id="stock" type="number" min="0" placeholder="موجودی"></div><button onclick="addProduct()">ثبت کالا</button><button onclick="loadProducts()">به‌روزرسانی فهرست کالاها</button><div id="products"></div></div>
<div class="card"><h2>وضعیت سامانه</h2><button onclick="health()">بررسی سلامت سرویس</button><div id="health" class="status">در انتظار بررسی</div></div>
</main><script>
let tok=sessionStorage.getItem('leadora_token')||'';
const val=id=>document.getElementById(id).value.trim();
const show=(id,s)=>document.getElementById(id).textContent=s;
async function req(path,method='GET',body=null){const h={'Content-Type':'application/json'};if(tok)h.Authorization='Bearer '+tok;const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):null});const d=await r.json();if(!r.ok)throw Error(d.detail||'خطا');return d}
async function auth(mode){try{const b={company_name:val('company'),email:val('email'),password:val('password')};if(mode==='register')Object.assign(b,{industry:val('industry')});const d=await req('/api/'+mode,'POST',b);tok=d.token;sessionStorage.setItem('leadora_token',tok);show('status','ورود موفق بود. اکنون می‌توانید کالا ثبت کنید.');await loadProducts()}catch(e){show('status',e.message)}}
async function addProduct(){try{const d=await req('/api/products','POST',{sku:val('sku'),name:val('pname'),price:Number(val('price')||0),stock:Number(val('stock')||0)});show('status',d.message);await loadProducts()}catch(e){show('status',e.message)}}
async function loadProducts(){try{const rows=await req('/api/products');document.getElementById('products').innerHTML='<table><thead><tr><th>کد</th><th>کالا</th><th>قیمت</th><th>موجودی</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.sku)+'</td><td>'+esc(x.name)+'</td><td>'+x.price+'</td><td>'+x.stock+'</td></tr>').join('')+'</tbody></table>'}catch(e){show('status',e.message)}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function health(){try{show('health',JSON.stringify(await req('/api/health'),null,2))}catch(e){show('health',e.message)}}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
let installPrompt = null;
const installButton = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
  installButton.hidden = false;
});
installButton.addEventListener('click', async () => {
  if (!installPrompt) {
    show('status', 'از منوی مرورگر گزینهٔ «افزودن به صفحهٔ اصلی» یا «Install app» را انتخاب کنید.');
    return;
  }
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  installButton.hidden = true;
});
window.addEventListener('appinstalled', () => {
  installButton.hidden = true;
  show('status', 'LEADORA روی دستگاه نصب شد.');
});
</script></body></html>
