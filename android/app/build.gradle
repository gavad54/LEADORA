plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

// Never permit a release task to proceed without an explicitly configured signing key.
// Debug builds remain available for CI and emulator testing.
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("releas") }
if (releaseTaskRequested && !(releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword)) {
    throw new GradleException("Release signing is not configured. Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD using protected CI secrets.")
}

android {
    namespace 'com.leadora.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leadora.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug { }
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}