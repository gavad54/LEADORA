plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leadora.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leadora.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { }
        release {
            // GitHub Actions produces an installable release build signed with a CI-generated key.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}