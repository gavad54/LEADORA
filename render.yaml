services:
  - type: web
    name: leadora
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LEADORA_ENV
        value: production
      - key: LEADORA_DB
        value: /data/leadora.db
      - key: LEADORA_SECRET
        generateValue: true
