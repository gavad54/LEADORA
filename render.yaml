services:
  - type: web
    name: leadora
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: leadora-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LEADORA_ENV
        value: production
      - key: LEADORA_DB
        value: /data/leadora.db
      - key: LEADORA_SECRET
        generateValue: true
