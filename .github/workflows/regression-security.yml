name: LEADORA regression and security tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run regression and security tests
        env:
          LEADORA_ENV: test
          LEADORA_SECRET: test-secret-that-is-long-enough-for-regression-tests
        run: pytest -q
