name: LEADORA CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Extract browser JavaScript
        run: |
          python - <<'PYCODE'
          import re
          from pathlib import Path
          for source, output in [
              ('app/static/index.html', '/tmp/leadora-main.js'),
              ('app/static/agents.html', '/tmp/leadora-agents.js'),
              ('app/static/finance.html', '/tmp/leadora-finance.js'),
              ('app/static/ai-command-center.html', '/tmp/leadora-ai-command-center.js'),
              ('app/static/owner-pricing.html', '/tmp/leadora-owner-pricing.js'),
              ('app/static/plans.html', '/tmp/leadora-plans.js'),
          ]:
              page = Path(source).read_text(encoding='utf-8')
              Path(output).write_text('\\n'.join(re.findall(r'<script>(.*?)</script>', page, re.S)), encoding='utf-8')
          PYCODE
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --check /tmp/leadora-main.js
      - run: node --check /tmp/leadora-agents.js
      - run: node --check /tmp/leadora-finance.js
      - run: node --check /tmp/leadora-ai-command-center.js
      - run: node --check /tmp/leadora-owner-pricing.js
      - run: node --check /tmp/leadora-plans.js
      - run: node --check app/static/service-worker.js
      - name: Validate PWA manifest
        run: python -c "import json; json.load(open('app/static/manifest.webmanifest', encoding='utf-8'))"
      - name: Validate Docker Compose configuration
        env:
          LEADORA_SECRET: ci-only-not-a-production-secret-ci-only
        run: docker compose config -q
      - name: Build production Docker image
        run: docker build --tag leadora-ci .
