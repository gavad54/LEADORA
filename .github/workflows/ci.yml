name: LEADORA CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest CI run for each branch to avoid stale queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Extract browser JavaScript
        run: |
          python - <<'PYCODE'
          import re
          from pathlib import Path
          page = Path('app/static/index.html').read_text()
          Path('/tmp/leadora.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', page, re.S)))
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check /tmp/leadora.js
