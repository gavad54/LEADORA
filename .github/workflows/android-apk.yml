name: Build LEADORA Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/public-home-optional-auth]
    paths:
      - "android/**"
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/LEADORA-Android.apk
          sha256sum release/LEADORA-Android.apk > release/LEADORA-Android.apk.sha256
          file release/LEADORA-Android.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEADORA-Android-APK
          path: release/*
          retention-days: 30
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-v1.0.${{ github.run_number }}
          name: LEADORA Android Test Build v1.0.${{ github.run_number }}
          body: |
            TEST BUILD ONLY — not an official commercial release.
            CI-built debug-signed APK for installation and functional testing.
            Signing keys may differ between CI runs; do not rely on in-place upgrades.
            Internet connection is required for live business data. Do not use real sensitive production data in this test build.
          files: |
            release/LEADORA-Android.apk
            release/LEADORA-Android.apk.sha256
          prerelease: true
          make_latest: false
