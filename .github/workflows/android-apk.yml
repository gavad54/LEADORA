name: Build LEADORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/LEADORA-Android.apk
          sha256sum release/LEADORA-Android.apk > release/LEADORA-Android.apk.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEADORA-Android-APK
          path: release/*
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: LEADORA Android v1.0.${{ github.run_number }}
          body: |
            LEADORA Android app for the live LEADORA business platform.
            This APK is CI-built and debug-signed for direct installation/testing.
            Internet connection is required; business data remains on the LEADORA production server.
          files: |
            release/LEADORA-Android.apk
            release/LEADORA-Android.apk.sha256
          make_latest: true
