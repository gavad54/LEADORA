name: Build LEADORA Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-30;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug && mkdir -p ../release && cp app/build/outputs/apk/debug/app-debug.apk ../release/LEADORA-Android.apk
      - name: Public production smoke checks
        id: production_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://leadora-web-production.up.railway.app/api/health" -o /tmp/leadora-health.json
          python - <<'PY'
          import json
          with open("/tmp/leadora-health.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("database") == "ok", "public health endpoint did not report database=ok"
          print("public_api_health=PASS")
          PY
          curl -fsS --max-time 20 "https://leadora-web-production.up.railway.app/" -o /tmp/leadora-home.html
          grep -q 'dir="rtl"' /tmp/leadora-home.html
          grep -q 'ورود / ساخت حساب' /tmp/leadora-home.html
          echo "public_homepage_smoke=PASS"
      - name: Record production smoke status
        if: steps.production_smoke.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### Production smoke check: BLOCKED"
            echo "The current Railway homepage did not satisfy the expected public RTL/login-call-to-action checks, even though the health endpoint returned database=ok."
            echo "This does not block testing the APK artifact, but it is a release blocker for merge/deploy until the production homepage is inspected and updated."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install and launch APK on a manually managed Android emulator
        shell: bash
        env:
          ANDROID_API_LEVEL: "30"
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          "$AVDMANAGER" create avd --name leadora_api30 --package "system-images;android-${ANDROID_API_LEVEL};google_apis;x86_64" --device pixel_2 --force
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p release
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$EMULATOR"
          "$EMULATOR" -avd leadora_api30 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -no-metrics > /tmp/leadora-emulator.log 2>&1 &
          EMULATOR_PID=$!
          capture_diagnostics() {
            set +e
            timeout 10s adb devices -l > release/android-adb-devices.txt 2>&1
            timeout 15s adb logcat -d -t 3000 > release/android-emulator-logcat.txt 2>&1
            timeout 10s adb shell dumpsys activity activities > release/android-activities.txt 2>&1
            cp /tmp/leadora-emulator.log release/android-emulator-boot.log 2>/dev/null || true
            set -e
          }
          cleanup() {
            capture_diagnostics
            timeout 10s adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          timeout 45s adb wait-for-device
          booted=false
          for attempt in $(seq 1 180); do
            if [ "$(timeout 12s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [ "$booted" != true ]; then
            cat /tmp/leadora-emulator.log
            echo "Android emulator did not complete boot within 15 minutes."
            exit 1
          fi
          # Avoid unbounded package-manager enumeration: this command hung on
          # the previous runner after sys.boot_completed became 1.
          timeout 30s adb get-state
          APK="$GITHUB_WORKSPACE/release/LEADORA-Android.apk"
          test -s "$APK"
          timeout 120s adb install -r "$APK"
          timeout 30s adb shell pm path com.leadora.app
          timeout 20s adb logcat -c
          timeout 45s adb shell am start -W -n com.leadora.app/.MainActivity
          sleep 8
          timeout 30s adb shell dumpsys activity activities > release/android-activities-after-launch.txt
          grep -q 'com.leadora.app' release/android-activities-after-launch.txt
          timeout 30s adb exec-out screencap -p > release/android-emulator-home.png
          test -s release/android-emulator-home.png
          timeout 30s adb logcat -d -t 5000 -s AndroidRuntime:E > release/android-runtime-errors.txt
          if grep -q 'FATAL EXCEPTION' release/android-runtime-errors.txt; then
            cat release/android-runtime-errors.txt
            exit 1
          fi
          printf 'result=PASS\npackage=com.leadora.app\napi_level=%s\nchecks=install,activity_launch,foreground_activity,screenshot,no_fatal_exception\n' "$ANDROID_API_LEVEL" > release/android-emulator-smoke.txt
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/release/LEADORA-Android.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK" || { echo "ERROR: staged APK missing during verification"; exit 1; }
          mkdir -p release
          "$BUILD_TOOLS/apksigner" verify --verbose release/LEADORA-Android.apk
          "$BUILD_TOOLS/aapt" dump badging release/LEADORA-Android.apk > release/LEADORA-Android-metadata.txt
          {
            echo "source_commit=$GITHUB_SHA"
            echo "apk_size_bytes=$(stat -c '%s' release/LEADORA-Android.apk)"
            sha256sum release/LEADORA-Android.apk
          } > release/LEADORA-Android-build-info.txt
          sha256sum release/LEADORA-Android.apk > release/LEADORA-Android.apk.sha256
          file release/LEADORA-Android.apk
          cat release/LEADORA-Android-build-info.txt
      - name: Upload build and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEADORA-Android-APK
          path: release/*
          retention-days: 30
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-v1.0.${{ github.run_number }}
          name: LEADORA Android Test Build v1.0.${{ github.run_number }}
          body: |
            TEST BUILD ONLY — not an official commercial release.
            CI-built debug-signed APK for installation and functional testing.
            Signing keys may differ between CI runs; do not rely on in-place upgrades.
            Internet connection is required for live business data. Do not use real sensitive production data in this test build.
          files: |
            release/LEADORA-Android.apk
            release/LEADORA-Android.apk.sha256
            release/LEADORA-Android-build-info.txt
          prerelease: true
          make_latest: false
