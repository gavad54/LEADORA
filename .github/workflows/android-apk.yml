name: Build LEADORA Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/public-home-optional-auth]
    paths:
      - "android/**"
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install stable Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Install and launch APK on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            # This action executes the script through /bin/sh, not necessarily Bash.
            # Use POSIX shell options; each pipeline's final grep is the explicit assertion,
            # and commands whose failures matter are checked directly with -e.
            set -eu
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            mkdir -p release
            test -s "$APK"
            # Verify the public production API and Persian RTL landing contract from the runner.
            curl -fsS --max-time 20 "https://leadora-web-production.up.railway.app/api/health" -o /tmp/leadora-health.json
            python - <<'PY'
            import json
            with open("/tmp/leadora-health.json", encoding="utf-8") as f:
                data = json.load(f)
            assert data.get("database") == "ok", "public health endpoint did not report database=ok"
            print("public_api_health=PASS")
            PY
            curl -fsS --max-time 20 "https://leadora-web-production.up.railway.app/" -o /tmp/leadora-home.html
            grep -q 'dir="rtl"' /tmp/leadora-home.html
            grep -q 'ورود / ساخت حساب' /tmp/leadora-home.html
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb install "$APK"
            adb shell pm path com.leadora.app
            adb shell am force-stop com.leadora.app
            adb logcat -c
            adb shell monkey -p com.leadora.app 1
            # Allow the WebView to load the public landing page over HTTPS.
            for attempt in $(seq 1 12); do
              sleep 5
              adb shell uiautomator dump /sdcard/leadora-window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/leadora-window.xml release/android-emulator-window.xml >/dev/null 2>&1 || true
              if [ -s release/android-emulator-window.xml ] && grep -q 'ورود / ساخت حساب' release/android-emulator-window.xml && grep -q 'کسب‌وکار خود را' release/android-emulator-window.xml; then
                break
              fi
            done
            test -s release/android-emulator-window.xml
            grep -q 'ورود / ساخت حساب' release/android-emulator-window.xml
            grep -q 'کسب‌وکار خود را' release/android-emulator-window.xml
            adb exec-out screencap -p > release/android-emulator-home.png
            # Keep only crash evidence; do not publish full device logs.
            adb logcat -d -t 5000 -s AndroidRuntime:E > /tmp/leadora-android-runtime-errors.txt
            if grep -q 'FATAL EXCEPTION' /tmp/leadora-android-runtime-errors.txt; then
              cat /tmp/leadora-android-runtime-errors.txt
              exit 1
            fi
            printf 'result=PASS\npackage=com.leadora.app\napi_level=35\nchecks=install,launch,public_home,login_cta,no_fatal_exception\n' > release/android-emulator-smoke.txt
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/LEADORA-Android.apk
          # Verify the package signature and parse the binary manifest instead of
          # treating a successful Gradle task or a non-empty file as sufficient.
          "$BUILD_TOOLS/apksigner" verify --verbose release/LEADORA-Android.apk
          "$BUILD_TOOLS/aapt" dump badging release/LEADORA-Android.apk > release/LEADORA-Android-metadata.txt
          {
            echo "source_commit=$GITHUB_SHA"
            echo "apk_size_bytes=$(stat -c '%s' release/LEADORA-Android.apk)"
            sha256sum release/LEADORA-Android.apk
          } > release/LEADORA-Android-build-info.txt
          sha256sum release/LEADORA-Android.apk > release/LEADORA-Android.apk.sha256
          file release/LEADORA-Android.apk
          cat release/LEADORA-Android-build-info.txt
      - name: Upload build and emulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: LEADORA-Android-APK
          path: release/*
          retention-days: 30
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-v1.0.${{ github.run_number }}
          name: LEADORA Android Test Build v1.0.${{ github.run_number }}
          body: |
            TEST BUILD ONLY — not an official commercial release.
            CI-built debug-signed APK for installation and functional testing.
            Signing keys may differ between CI runs; do not rely on in-place upgrades.
            Internet connection is required for live business data. Do not use real sensitive production data in this test build.
          files: |
            release/LEADORA-Android.apk
            release/LEADORA-Android.apk.sha256
            release/LEADORA-Android-build-info.txt
          prerelease: true
          make_latest: false
